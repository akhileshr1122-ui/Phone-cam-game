<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>MoveBox</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#06070B; overflow:hidden; font-family: "Segoe UI", Roboto, system-ui, sans-serif; color:#fff; }
  #v { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  #c { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:none; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; background:#06070B; text-align:center; padding:24px; }
  #start h1 { font-size:clamp(52px, 12vw, 120px); font-weight:900; letter-spacing:-0.04em; line-height:.9; }
  #start h1 span { display:block; color:#FFB020; }
  #start p { max-width:40ch; font-size:clamp(15px,2.4vw,22px); line-height:1.45; color:#B9BDD0; }
  #start button { font: 900 clamp(20px,3.5vw,30px)/1 inherit; padding:20px 44px; border:0; border-radius:999px; background:#FFB020; color:#1A1000; cursor:pointer; }
  #start button:active { transform:scale(.97); }
  #status { color:#7C819A; font-size:15px; min-height:1.4em; }
  #modelWrap { color:#B9BDD0; font-size:15px; }
  #modelWrap select { font:inherit; margin-left:8px; padding:6px 10px; border-radius:8px; border:1px solid #3A4058; background:#12141C; color:#fff; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div id="start">
  <h1>Move<span>Box</span></h1>
  <p>Six games played with your body. Stand 2–3 m from the phone so your whole body is in frame, feet included. Pair a Bluetooth controller to feel hits. Play on the big screen.</p>
  <label id="modelWrap">Tracking <select id="model"><option value="lightning">Fast (best on phones)</option><option value="thunder">Accurate (needs a strong phone)</option></select></label>
  <button id="go">Turn on camera</button>
  <div id="status"></div>
</div>

<script>
// ---------- Config ----------
// Optional photo backgrounds: paste an image URL or relative path (e.g. 'bg/cricket.jpg') to replace the drawn scene.
const BG_IMAGES = { cricket: '', hoops: '', asteroids: '' };
const GAMES = [
  { key: 'cricket',   label: 'Cricket',        sub: 'Swing to bat',    hint: 'The batter mirrors your body. Crouch and swing flat = sweep. Hands high = ramp or upper cut. Vertical swing = drives. Hard cross-bat = pull, cut, hook, slog. Barely move = block' },
  { key: 'badminton', label: 'Badminton',      sub: 'Rally to 11',     hint: 'Meet the shuttle with the racket head. Racket high and swinging down = smash' },
  { key: 'hoops',     label: 'Basketball',     sub: 'Throw to score',  hint: 'A ball waits in your hand. Flick it up at the hoop; a soft flick falls short, a hard one hits the board' },
  { key: 'pingpong',  label: 'Table Tennis',   sub: 'Rally to 11',    hint: 'No players — just your floating bat. Meet the ball, swipe to place it. High ball + hard down-swipe = smash' },
  { key: 'strike',    label: 'Finger Strike',  sub: 'Clear the rounds', hint: 'Your fingers are the guns — point to aim, it locks and fires itself. March in place to walk where you look, stop marching to stop. Duck to take cover and heal. Fist = holster. Clear every round' },
  { key: 'brickops',  label: 'Brick Ops',      sub: 'City siege · radar', hint: 'A brick city: take LONG to Site A, the TUNNEL to Site B, or push MID. The radar shows every soldier. March in place to walk, stop marching to stop, duck to heal. They shoot back — and burst into bricks and paint' },
  { key: 'fruit',     label: 'Fruit Slash',    sub: 'Twin katanas',   hint: 'Close your fists to draw the katanas. Slice fruit, never bombs' },
  { key: 'punch',     label: 'Punch Out',      sub: 'Hit the targets', hint: 'Slap the blue targets before they fade' },
];
const gameByKey = k => GAMES.find(g => g.key === k);
let env = 'stadium';   // 'stadium' = drawn arena, 'room' = your camera as the environment

// ---------- Setup ----------
const video = document.getElementById('v');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const startEl = document.getElementById('start');
const statusEl = document.getElementById('status');
const AMBER = '#FFB020', INK = '#3B4CFF', RED = '#FF3D5A', WHITE = '#FFFFFF', TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1;
const U = () => Math.min(W, H);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- Sound ----------
let AC = null;
function beep(f, d = 0.08, type = 'square', vol = 0.15) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function noise(dur = 1.2, vol = 0.25, freq = 900, q = 0.5) {   // crowd roar / thuds
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + Math.min(0.15, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    src.connect(f).connect(g).connect(AC.destination); src.start();
  } catch (e) {}
}

function sweep(f0, f1, d = 0.12, type = 'sine', vol = 0.15) {   // pitch glide
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}
function noiseSweep(dur, vol, f0, f1, q = 1) {   // filtered noise whose centre frequency glides: whoosh, squelch
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; const t = AC.currentTime;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(AC.destination); src.start();
  } catch (e) {}
}
function whoosh(power = 1) { noiseSweep(0.22, 0.12 + 0.14 * power, 900, 3200 + 1500 * power, 0.9); }
function squelch(size = 1) { noiseSweep(0.1, 0.32, 700, 180, 1.4); sweep(380 - 80 * size, 110, 0.1, 'sine', 0.22); }
function slashHit() { sweep(2400, 900, 0.07, 'triangle', 0.2); noiseSweep(0.06, 0.25, 5000, 1800, 2); }

// ---------- Haptics (Bluetooth controller via Gamepad API, phone vibration as fallback) ----------
let gamepadOn = false, toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 3; }
addEventListener('gamepadconnected', e => { gamepadOn = true; toast('Controller connected'); haptic(250, 1, 1); });
addEventListener('gamepaddisconnected', () => { gamepadOn = false; toast('Controller disconnected'); });
function haptic(ms, strong = 0.8, weak = 0.5) {
  let done = false;
  try {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      const a = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
      if (a && a.playEffect) { a.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); done = true; }
      else if (a && a.pulse) { a.pulse(strong, ms); done = true; }
    }
  } catch (e) {}
  if (!done && navigator.vibrate) navigator.vibrate(ms);
}

// ---------- Pose (One Euro filtered, velocity extrapolated to cut lag) ----------
let detector = null;
const KP = {};
let poseSeen = false;
function alphaFor(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
function euro(q, key, v, dt) {   // one-euro filter: smooth when still, snappy when moving
  const dk = 'v' + key, prev = q[key];
  if (prev === undefined) { q[key] = v; q[dk] = 0; return; }
  const dx = (v - prev) / dt, edx = q[dk] + alphaFor(1, dt) * (dx - q[dk]);
  const a = alphaFor(1.7 + 1.5 * Math.abs(edx), dt);
  q[dk] = edx; q[key] = prev + a * (v - prev);
}
async function poseLoop() {
  for (;;) {
    if (video.readyState >= 2) {
      try {
        const poses = await detector.estimatePoses(video, { maxPoses: 1 });
        const now = performance.now(), p = poses[0];
        poseSeen = !!p && p.keypoints.some(k => k.score > 0.3);
        if (p) for (const k of p.keypoints) {
          const q = KP[k.name] || (KP[k.name] = { t: now });
          const dt = clamp((now - q.t) / 1000, 0.008, 0.1);
          if (k.score >= 0.25) { euro(q, 'x', 1 - k.x / video.videoWidth, dt); euro(q, 'y', k.y / video.videoHeight, dt); }
          else { q.vx = 0; q.vy = 0; }
          q.s = k.score; q.t = now;
        }
        if (handLM && state === 'fruit' && (handTick++ % 2 === 0)) { try { readFists(handLM.detectForVideo(video, now), now); } catch (e) {} }
      } catch (e) { console.error(e); }
    }
    await new Promise(r => setTimeout(r, 0));
  }
}
function fit() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
}
function S(p) { const f = fit(); return { x: f.dx + p.x * f.dw, y: f.dy + p.y * f.dh, s: p.s }; }
function kp(name, min = 0.3) {   // returns the point predicted at render time (up to 70 ms ahead of the last detection)
  const q = KP[name]; if (!q || q.x === undefined || q.s < min) return null;
  const lead = clamp((performance.now() - q.t) / 1000, 0, 0.07);
  return { x: q.x + q.vx * lead, y: q.y + q.vy * lead, s: q.s, vx: q.vx, vy: q.vy };
}
function body() {
  const ls = kp('left_shoulder'), rs = kp('right_shoulder');
  if (!ls || !rs) return null;
  return { cx: (ls.x + rs.x) / 2, sy: (ls.y + rs.y) / 2, span: Math.max(0.05, Math.hypot(ls.x - rs.x, ls.y - rs.y)) };
}
function hands() { return [kp('left_wrist'), kp('right_wrist')].filter(Boolean).map(S); }
const trails = {};
let limbs = [];
function updateLimbs(dt) {
  limbs = []; const f = fit();
  for (const n of ['left_wrist', 'right_wrist', 'left_ankle', 'right_ankle']) {
    const p = kp(n); if (!p) { trails[n] = []; continue; }
    const s = S(p), vx = p.vx * f.dw, vy = p.vy * f.dh;
    const tr = trails[n] || (trails[n] = []); tr.push({ x: s.x, y: s.y }); if (tr.length > 10) tr.shift();
    limbs.push({ name: n, x: s.x, y: s.y, vx, vy, speed: Math.hypot(vx, vy), kind: n.includes('wrist') ? 'hand' : 'foot' });
  }
}
function drawHandAt(x, y, ang, s, grip) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = 'rgba(244,246,250,.95)'; ctx.strokeStyle = 'rgba(30,34,48,.5)'; ctx.lineWidth = Math.max(1.5, s * .08);
  ctx.beginPath(); ctx.ellipse(0, 0, s * .55, s * .7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const fx = (i - 1.5) * s * .3;
    ctx.beginPath(); ctx.ellipse(fx, -s * (grip ? .55 : .8), s * .13, s * (grip ? .28 : .42), (i - 1.5) * .08, 0, TAU);
    ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(s * .62, s * .15, s * .14, s * .3, .7, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawHands() {
  const inGame = !['menu', 'over', 'calibrate'].includes(state);
  let s = U() * .035;
  if (!inGame) {                                    // selection screens: match your real hand size
    const bd = body(), f = fit();
    s = clamp(bd ? bd.span * f.dh * .55 : U() * .08, U() * .05, U() * .13);
  }
  for (const h of limbs.filter(l => l.kind === 'hand'))
    drawHandAt(h.x, h.y, clamp(h.vx * .002, -.5, .5), s, false);
}

// ---------- Hand model (MediaPipe HandLandmarker): fist open/close for drawing and sheathing the swords ----------
let handLM = null, handModelState = 'off', handTick = 0;
const fists = { left: { closed: false, t: 0, ratio: 2 }, right: { closed: false, t: 0, ratio: 2 } };
async function loadHandModel() {
  handModelState = 'loading';
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    handLM = await vision.HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 });
    handModelState = 'ready'; toast('Hand tracking ready: close a fist to draw a sword');
  } catch (e) { handModelState = 'failed'; console.warn('hand model unavailable', e); }
}
function readFists(res, now) {   // fingertips close to the wrist (relative to palm size) = closed fist; matched to the nearest pose wrist
  if (!res || !res.landmarks) return;
  for (const lm of res.landmarks) {
    const w = lm[0], m = lm[9], palm = Math.hypot(w.x - m.x, w.y - m.y) || 0.01;
    const ratio = [8, 12, 16, 20].reduce((s, i) => s + Math.hypot(lm[i].x - w.x, lm[i].y - w.y) / palm, 0) / 4;
    const mx = 1 - w.x, my = w.y;
    let best = null, bd = 1e9;
    for (const side of ['left', 'right']) { const q = KP[side + '_wrist']; if (!q || q.x === undefined) continue; const d = Math.hypot(q.x - mx, q.y - my); if (d < bd) { bd = d; best = side; } }
    if (!best || bd > 0.2) continue;
    const f = fists[best]; f.ratio += (ratio - f.ratio) * 0.5; f.t = now;
    if (f.closed && f.ratio > 1.75) f.closed = false; else if (!f.closed && f.ratio < 1.45) f.closed = true;
  }
}

// ---------- State ----------
let state = 'menu';
let last = performance.now();
const cal = { t: 0, need: 2 };
let pending = null;
let game = null;
const hover = { key: null, t: 0 };
let flash = 0;
const pops = [], parts = [];
const cam = { zoom: 1, x: 0, y: 0, tz: 1, tx: 0, ty: 0 };

// ---------- Drawing helpers ----------
function txt(s, x, y, size, opts = {}) {
  ctx.font = `900 ${size}px "Segoe UI", Roboto, system-ui, sans-serif`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = opts.color || WHITE; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function seeded(seed) { let s = (seed | 0) || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function pop(text, x, y, color = AMBER, size = 44) { pops.push({ text, x, y, color, size, t: 1.2 }); }
function burst(x, y, color, n = 14, sp = 300, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = sp * (0.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0.5 + Math.random() * 0.4, color, r: 3 + Math.random() * 4, g: grav });
  }
}
function drawFx(dt) {
  for (const p of pops) { p.t -= dt; p.y -= 40 * dt; ctx.globalAlpha = clamp(p.t, 0, 1); txt(p.text, p.x, p.y, p.size, { color: p.color }); }
  ctx.globalAlpha = 1;
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t <= 0) pops.splice(i, 1);
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    ctx.globalAlpha = Math.max(0, p.t); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t <= 0) parts.splice(i, 1);
}
function drawCamera(dim) {
  ctx.fillStyle = '#06070B'; ctx.fillRect(-W, -H, W * 3, H * 3);
  if (video.readyState >= 2) {
    const f = fit();
    ctx.save(); ctx.translate(f.dx + f.dw, f.dy); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, f.dw, f.dh); ctx.restore();
  }
  ctx.fillStyle = `rgba(6,7,11,${dim})`; ctx.fillRect(-W, -H, W * 3, H * 3);
}
function drawPiP(corner = 'right') {
  if (video.readyState < 2) return;
  const w = Math.min(W * 0.18, 200), h = w * ((video.videoHeight / video.videoWidth) || 0.75), x = corner === 'left' ? 14 : W - w - 14, y = H - h - 14;
  ctx.save(); rr(x, y, w, h, 12); ctx.clip(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, w, h); ctx.restore();
  rr(x, y, w, h, 12); ctx.lineWidth = 3; ctx.strokeStyle = poseSeen ? 'rgba(255,176,32,.9)' : 'rgba(255,61,90,.9)'; ctx.stroke();
  if (!poseSeen) txt('no body', x + w / 2, y + h / 2, 18, { color: RED });
}
function drawTrails(color = 'rgba(255,255,255,.9)') {
  for (const n in trails) {
    const tr = trails[n]; if (tr.length < 3) continue;
    for (let i = 1; i < tr.length; i++) {
      const a = i / tr.length;
      ctx.strokeStyle = color; ctx.globalAlpha = a * 0.8; ctx.lineWidth = 2 + a * 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
// Camera transform (zoom/pan) for world drawing
function camUpdate(dt) {
  const k = Math.min(1, dt * 5);
  cam.zoom += (cam.tz - cam.zoom) * k; cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
}
function camReset() { cam.tz = 1; cam.tx = 0; cam.ty = 0; }
function camFocus(x, y, zoom) {   // keep the point (x,y) centred, never showing outside the canvas
  cam.tz = zoom;
  cam.tx = clamp(x - W / 2, -(W / 2 - W / (2 * zoom)), W / 2 - W / (2 * zoom));
  cam.ty = clamp(y - H / 2, -(H / 2 - H / (2 * zoom)), H / 2 - H / (2 * zoom));
}
function camBegin() { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-W / 2 - cam.x, -H / 2 - cam.y); }
function camEnd() { ctx.restore(); }

function drawFeet() {
  for (const n of ['left_ankle', 'right_ankle']) {
    const p = kp(n); if (!p) continue; const A = S(p);
    ctx.beginPath(); ctx.arc(A.x, A.y, 24, 0, TAU); ctx.fillStyle = 'rgba(59,76,255,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(A.x, A.y, 13, 0, TAU); ctx.fillStyle = INK; ctx.fill();
  }
}
function hud(left, right, center, centerColor) {
  if (left) txt(left, 32, 40, 48, { align: 'left' });
  if (right) txt(right, W - 32, 40, 48, { align: 'right', color: RED });
  if (center) txt(center, W / 2, 40, 30, { color: centerColor || AMBER });
}
function buttons(list, dt) {
  const hs = hands();
  let active = null;
  for (const b of list) {
    const inside = hs.some(h => h.x > b.x && h.x < b.x + b.w && h.y > b.y && h.y < b.y + b.h);
    if (inside) active = b;
    rr(b.x, b.y, b.w, b.h, 22);
    ctx.fillStyle = inside ? 'rgba(255,176,32,.28)' : 'rgba(6,7,11,.6)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = inside ? AMBER : 'rgba(255,255,255,.35)'; ctx.stroke();
    txt(b.label, b.x + b.w / 2, b.y + b.h / 2 - (b.sub ? b.h * 0.1 : 0), Math.min(40, b.h * 0.28));

    }
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x2.x, x2.y, 2.5, 0, TAU); ctx.fill();
  }
  const bw = W * .26;
  ctx.fillStyle = 'rgba(10,12,20,.55)'; rr(W / 2 - bw / 2, H - 46, bw, 16, 8); ctx.fill();
  ctx.fillStyle = g.hp > 35 ? '#37C46B' : '#FF4A3A';
  rr(W / 2 - bw / 2 + 2, H - 44, Math.max(0, (bw - 4) * g.hp / 100), 12, 6); ctx.fill();
  // ---- radar: the map, you (green arrow), every soldier (red dots) ----
  const RSr = 150, RXr = W - RSr - 16, RYr = 60, MH = 22, scR = RSr / (MH * 2);
  const mxr = wx => RXr + (wx + MH) * scR, mzr = wz => RYr + (wz + MH) * scR;
  ctx.fillStyle = 'rgba(8,10,16,.72)'; rr(RXr - 6, RYr - 6, RSr + 12, RSr + 12, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(160,170,190,.5)'; ctx.lineWidth = 1.5; rr(RXr - 6, RYr - 6, RSr + 12, RSr + 12, 10); ctx.stroke();
  ctx.fillStyle = '#5a6472';
  for (const w of L3.RWALLS) ctx.fillRect(mxr(w.x - w.hw), mzr(w.z - w.hd), w.hw * 2 * scR, w.hd * 2 * scR);
  for (const st2 of L3.SITES) {
    ctx.fillStyle = '#' + st2.c.toString(16).padStart(6, '0');
    ctx.globalAlpha = .55; ctx.beginPath(); ctx.arc(mxr(st2.x), mzr(st2.z), 8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#F4F6FA'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(st2.label, mxr(st2.x), mzr(st2.z));
  }
  if (g.en) for (const en of g.en) {
    if (en.gone) continue;
    ctx.fillStyle = '#FF4A3A'; ctx.beginPath(); ctx.arc(mxr(en.x), mzr(en.z), 3.5, 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(mxr(g.px), mzr(g.pz));
  ctx.rotate(Math.atan2(-Math.cos(g.yaw), -Math.sin(g.yaw)));
  ctx.fillStyle = '#37C46B'; ctx.beginPath();
  ctx.moveTo(7, 0); ctx.lineTo(-4, 4.5); ctx.lineTo(-4, -4.5); ctx.closePath(); ctx.fill();
  ctx.restore();
  const leftE = g.en ? g.en.filter(e => !e.gone).length : 0;
  hud(`${g.kills} ✕`, `round ${g.round} · ${leftE} left`,
      g.duck ? 'IN COVER — healing' : (g.gait > .15 ? '● moving' : '■ stopped'));
  if (!poseSeen) txt('Step back so your whole body is in view', W / 2, H * .5, 26, { color: '#C9CCDD' });
  if (handModelState === 'loading') txt('calibrating finger guns…', W / 2, H * .12, 20, { color: '#C9CCDD' });
  liveButtons = []; tapButtons = [];
  if (g.hp <= 0) { g.final = g.kills; state = 'over'; }
}

addEventListener('resize', () => {
  GL.setSize(W, H);
  C3.cam.aspect = W / H; C3.cam.updateProjectionMatrix();
  B3.cam.aspect = W / H; B3.cam.updateProjectionMatrix();
  T3.cam.aspect = W / H; T3.cam.updateProjectionMatrix();
  K3.cam.aspect = W / H; K3.cam.updateProjectionMatrix();
  L3.cam.aspect = W / H; L3.cam.updateProjectionMatrix();
});

// ---------- Main loop ----------
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateLimbs(dt);
  GLC.style.display = (state === 'cricket' || state === 'badminton' || state === 'pingpong' || state === 'strike' || state === 'brickops') ? 'block' : 'none';
  ({ menu, calibrate, cricket: cricket3, badminton: badminton3, pingpong: pingpong3, strike: strike3, brickops: brickops3, hoops, fruit, punch, over })[state](dt);
  if (['cricket', 'badminton', 'pingpong', 'strike', 'brickops', 'hoops'].includes(state) && env === 'stadium') drawPiP();
  drawFx(dt);
  const gm = gameByKey(state);
  if (gm && game && game.hint > 0) { game.hint -= dt; ctx.globalAlpha = Math.min(1, game.hint); txt(gm.hint, W / 2, H * 0.12, 24, { color: '#C9CCDD' }); ctx.globalAlpha = 1; }
  if (toastT > 0) { toastT -= dt; ctx.globalAlpha = Math.min(1, toastT); txt(toastMsg, W / 2, H - 30, 20, { color: AMBER }); ctx.globalAlpha = 1; }
  if (flash > 0) { flash -= dt; ctx.fillStyle = `rgba(255,61,90,${flash})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

// ---------- Boot ----------
document.getElementById('go').addEventListener('click', async () => {
  try {
    statusEl.textContent = 'Opening camera…';
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Loading body tracker…';
    await tf.setBackend('webgl'); await tf.ready();
    const accurate = document.getElementById('model').value === 'thunder';
    detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      { modelType: accurate ? poseDetection.movenet.modelType.SINGLEPOSE_THUNDER : poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: false });
    startEl.remove(); resize();
    loadHandModel();
    if (navigator.getGamepads && [...navigator.getGamepads()].some(Boolean)) gamepadOn = true;
    poseLoop(); last = performance.now(); requestAnimationFrame(frame);
  } catch (err) {
    statusEl.textContent = err.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow the camera for this page in Chrome and try again.'
      : 'Could not start: ' + err.message + ' (check you have internet for the first load)';
  }
});
</script>
