<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>MoveBox</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#06070B; overflow:hidden; font-family: "Segoe UI", Roboto, system-ui, sans-serif; color:#fff; }
  #v { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  #c { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; background:#06070B; text-align:center; padding:24px; }
  #start h1 { font-size:clamp(52px, 12vw, 120px); font-weight:900; letter-spacing:-0.04em; line-height:.9; }
  #start h1 span { display:block; color:#FFB020; }
  #start p { max-width:40ch; font-size:clamp(15px,2.4vw,22px); line-height:1.45; color:#B9BDD0; }
  #start button { font: 900 clamp(20px,3.5vw,30px)/1 inherit; padding:20px 44px; border:0; border-radius:999px; background:#FFB020; color:#1A1000; cursor:pointer; }
  #start button:active { transform:scale(.97); }
  #status { color:#7C819A; font-size:15px; min-height:1.4em; }
  #modelWrap { color:#B9BDD0; font-size:15px; }
  #modelWrap select { font:inherit; margin-left:8px; padding:6px 10px; border-radius:8px; border:1px solid #3A4058; background:#12141C; color:#fff; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="start">
  <h1>Move<span>Box</span></h1>
  <p>Five games played with your body. Stand 2–3 m from the phone so your whole body is in frame, feet included. Pair a Bluetooth controller to feel hits. Play on the big screen.</p>
  <label id="modelWrap">Tracking <select id="model"><option value="lightning">Fast (best on phones)</option><option value="thunder">Accurate (needs a strong phone)</option></select></label>
  <button id="go">Turn on camera</button>
  <div id="status"></div>
</div>

<script>
// ---------- Config ----------
// Optional photo backgrounds: paste an image URL or relative path (e.g. 'bg/cricket.jpg') to replace the drawn scene.
const BG_IMAGES = { cricket: '', hoops: '', asteroids: '' };
const GAMES = [
  { key: 'cricket',   label: 'Cricket',        sub: 'Swing to bat',    hint: 'Lift your hands (backlift), then swing down as the ball arrives. Swing to your left = leg side, right = off side' },
  { key: 'hoops',     label: 'Basketball',     sub: 'Throw to score',  hint: 'Reach for the ball, flick it up at the hoop, then grab the rebound' },
  { key: 'fruit',     label: 'Fruit Slash',    sub: 'Twin katanas',   hint: 'Close your fists to draw the katanas. Slice fruit, never bombs' },
  { key: 'punch',     label: 'Punch Out',      sub: 'Hit the targets', hint: 'Slap the blue targets before they fade' },
  { key: 'asteroids', label: 'Asteroid Smash', sub: 'Punch and kick',  hint: 'Punch rocks. Green rocks only break with a kick' },
];
const gameByKey = k => GAMES.find(g => g.key === k);
let env = 'stadium';   // 'stadium' = drawn arena, 'room' = your camera as the environment

// ---------- Setup ----------
const video = document.getElementById('v');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const startEl = document.getElementById('start');
const statusEl = document.getElementById('status');
const AMBER = '#FFB020', INK = '#3B4CFF', RED = '#FF3D5A', WHITE = '#FFFFFF', TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1;
const U = () => Math.min(W, H);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- Sound ----------
let AC = null;
function beep(f, d = 0.08, type = 'square', vol = 0.15) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function noise(dur = 1.2, vol = 0.25, freq = 900, q = 0.5) {   // crowd roar / thuds
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + Math.min(0.15, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    src.connect(f).connect(g).connect(AC.destination); src.start();
  } catch (e) {}
}

// ---------- Haptics (Bluetooth controller via Gamepad API, phone vibration as fallback) ----------
let gamepadOn = false, toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 3; }
addEventListener('gamepadconnected', e => { gamepadOn = true; toast('Controller connected'); haptic(250, 1, 1); });
addEventListener('gamepaddisconnected', () => { gamepadOn = false; toast('Controller disconnected'); });
function haptic(ms, strong = 0.8, weak = 0.5) {
  let done = false;
  try {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      const a = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
      if (a && a.playEffect) { a.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); done = true; }
      else if (a && a.pulse) { a.pulse(strong, ms); done = true; }
    }
  } catch (e) {}
  if (!done && navigator.vibrate) navigator.vibrate(ms);
}

// ---------- Pose (One Euro filtered, velocity extrapolated to cut lag) ----------
let detector = null;
const KP = {};
let poseSeen = false;
function alphaFor(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
function euro(q, key, v, dt) {   // one-euro filter: smooth when still, snappy when moving
  const dk = 'v' + key, prev = q[key];
  if (prev === undefined) { q[key] = v; q[dk] = 0; return; }
  const dx = (v - prev) / dt, edx = q[dk] + alphaFor(1, dt) * (dx - q[dk]);
  const a = alphaFor(1.7 + 1.5 * Math.abs(edx), dt);
  q[dk] = edx; q[key] = prev + a * (v - prev);
}
async function poseLoop() {
  for (;;) {
    if (video.readyState >= 2) {
      try {
        const poses = await detector.estimatePoses(video, { maxPoses: 1 });
        const now = performance.now(), p = poses[0];
        poseSeen = !!p && p.keypoints.some(k => k.score > 0.3);
        if (p) for (const k of p.keypoints) {
          const q = KP[k.name] || (KP[k.name] = { t: now });
          const dt = clamp((now - q.t) / 1000, 0.008, 0.1);
          if (k.score >= 0.25) { euro(q, 'x', 1 - k.x / video.videoWidth, dt); euro(q, 'y', k.y / video.videoHeight, dt); }
          else { q.vx = 0; q.vy = 0; }
          q.s = k.score; q.t = now;
        }
        if (handLM && state === 'fruit' && (handTick++ % 2 === 0)) { try { readFists(handLM.detectForVideo(video, now), now); } catch (e) {} }
      } catch (e) { console.error(e); }
    }
    await new Promise(r => setTimeout(r, 0));
  }
}
function fit() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
}
function S(p) { const f = fit(); return { x: f.dx + p.x * f.dw, y: f.dy + p.y * f.dh, s: p.s }; }
function kp(name, min = 0.3) {   // returns the point predicted at render time (up to 70 ms ahead of the last detection)
  const q = KP[name]; if (!q || q.x === undefined || q.s < min) return null;
  const lead = clamp((performance.now() - q.t) / 1000, 0, 0.07);
  return { x: q.x + q.vx * lead, y: q.y + q.vy * lead, s: q.s, vx: q.vx, vy: q.vy };
}
function body() {
  const ls = kp('left_shoulder'), rs = kp('right_shoulder');
  if (!ls || !rs) return null;
  return { cx: (ls.x + rs.x) / 2, sy: (ls.y + rs.y) / 2, span: Math.max(0.05, Math.hypot(ls.x - rs.x, ls.y - rs.y)) };
}
function hands() { return [kp('left_wrist'), kp('right_wrist')].filter(Boolean).map(S); }
const trails = {};
let limbs = [];
function updateLimbs(dt) {
  limbs = []; const f = fit();
  for (const n of ['left_wrist', 'right_wrist', 'left_ankle', 'right_ankle']) {
    const p = kp(n); if (!p) { trails[n] = []; continue; }
    const s = S(p), vx = p.vx * f.dw, vy = p.vy * f.dh;
    const tr = trails[n] || (trails[n] = []); tr.push({ x: s.x, y: s.y }); if (tr.length > 10) tr.shift();
    limbs.push({ name: n, x: s.x, y: s.y, vx, vy, speed: Math.hypot(vx, vy), kind: n.includes('wrist') ? 'hand' : 'foot' });
  }
}
function drawHands() {
  for (const h of hands()) {
    ctx.beginPath(); ctx.arc(h.x, h.y, 26, 0, TAU); ctx.fillStyle = 'rgba(255,176,32,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, TAU); ctx.fillStyle = AMBER; ctx.fill();
  }
}

// ---------- Hand model (MediaPipe HandLandmarker): fist open/close for drawing and sheathing the swords ----------
let handLM = null, handModelState = 'off', handTick = 0;
const fists = { left: { closed: false, t: 0, ratio: 2 }, right: { closed: false, t: 0, ratio: 2 } };
async function loadHandModel() {
  handModelState = 'loading';
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    handLM = await vision.HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4 });
    handModelState = 'ready'; toast('Hand tracking ready: close a fist to draw a sword');
  } catch (e) { handModelState = 'failed'; console.warn('hand model unavailable', e); }
}
function readFists(res, now) {   // fingertips close to the wrist (relative to palm size) = closed fist; matched to the nearest pose wrist
  if (!res || !res.landmarks) return;
  for (const lm of res.landmarks) {
    const w = lm[0], m = lm[9], palm = Math.hypot(w.x - m.x, w.y - m.y) || 0.01;
    const ratio = [8, 12, 16, 20].reduce((s, i) => s + Math.hypot(lm[i].x - w.x, lm[i].y - w.y) / palm, 0) / 4;
    const mx = 1 - w.x, my = w.y;
    let best = null, bd = 1e9;
    for (const side of ['left', 'right']) { const q = KP[side + '_wrist']; if (!q || q.x === undefined) continue; const d = Math.hypot(q.x - mx, q.y - my); if (d < bd) { bd = d; best = side; } }
    if (!best || bd > 0.2) continue;
    const f = fists[best]; f.ratio += (ratio - f.ratio) * 0.5; f.t = now;
    if (f.closed && f.ratio > 1.75) f.closed = false; else if (!f.closed && f.ratio < 1.45) f.closed = true;
  }
}

// ---------- State ----------
let state = 'menu';
let last = performance.now();
const cal = { t: 0, need: 2 };
let pending = null;
let game = null;
const hover = { key: null, t: 0 };
let flash = 0;
const pops = [], parts = [];
const cam = { zoom: 1, x: 0, y: 0, tz: 1, tx: 0, ty: 0 };

// ---------- Drawing helpers ----------
function txt(s, x, y, size, opts = {}) {
  ctx.font = `900 ${size}px "Segoe UI", Roboto, system-ui, sans-serif`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = opts.color || WHITE; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function seeded(seed) { let s = (seed | 0) || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function pop(text, x, y, color = AMBER, size = 44) { pops.push({ text, x, y, color, size, t: 1.2 }); }
function burst(x, y, color, n = 14, sp = 300, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = sp * (0.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0.5 + Math.random() * 0.4, color, r: 3 + Math.random() * 4, g: grav });
  }
}
function drawFx(dt) {
  for (const p of pops) { p.t -= dt; p.y -= 40 * dt; ctx.globalAlpha = clamp(p.t, 0, 1); txt(p.text, p.x, p.y, p.size, { color: p.color }); }
  ctx.globalAlpha = 1;
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t <= 0) pops.splice(i, 1);
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    ctx.globalAlpha = Math.max(0, p.t); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t <= 0) parts.splice(i, 1);
}
function drawCamera(dim) {
  ctx.fillStyle = '#06070B'; ctx.fillRect(-W, -H, W * 3, H * 3);
  if (video.readyState >= 2) {
    const f = fit();
    ctx.save(); ctx.translate(f.dx + f.dw, f.dy); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, f.dw, f.dh); ctx.restore();
  }
  ctx.fillStyle = `rgba(6,7,11,${dim})`; ctx.fillRect(-W, -H, W * 3, H * 3);
}
function drawPiP(corner = 'right') {
  if (video.readyState < 2) return;
  const w = Math.min(W * 0.18, 200), h = w * ((video.videoHeight / video.videoWidth) || 0.75), x = corner === 'left' ? 14 : W - w - 14, y = H - h - 14;
  ctx.save(); rr(x, y, w, h, 12); ctx.clip(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, w, h); ctx.restore();
  rr(x, y, w, h, 12); ctx.lineWidth = 3; ctx.strokeStyle = poseSeen ? 'rgba(255,176,32,.9)' : 'rgba(255,61,90,.9)'; ctx.stroke();
  if (!poseSeen) txt('no body', x + w / 2, y + h / 2, 18, { color: RED });
}
function drawTrails(color = 'rgba(255,255,255,.9)') {
  for (const n in trails) {
    const tr = trails[n]; if (tr.length < 3) continue;
    for (let i = 1; i < tr.length; i++) {
      const a = i / tr.length;
      ctx.strokeStyle = color; ctx.globalAlpha = a * 0.8; ctx.lineWidth = 2 + a * 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
// Camera transform (zoom/pan) for world drawing
function camUpdate(dt) {
  const k = Math.min(1, dt * 5);
  cam.zoom += (cam.tz - cam.zoom) * k; cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
}
function camReset() { cam.tz = 1; cam.tx = 0; cam.ty = 0; }
function camFocus(x, y, zoom) {   // keep the point (x,y) centred, never showing outside the canvas
  cam.tz = zoom;
  cam.tx = clamp(x - W / 2, -(W / 2 - W / (2 * zoom)), W / 2 - W / (2 * zoom));
  cam.ty = clamp(y - H / 2, -(H / 2 - H / (2 * zoom)), H / 2 - H / (2 * zoom));
}
function camBegin() { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-W / 2 - cam.x, -H / 2 - cam.y); }
function camEnd() { ctx.restore(); }

function drawFeet() {
  for (const n of ['left_ankle', 'right_ankle']) {
    const p = kp(n); if (!p) continue; const A = S(p);
    ctx.beginPath(); ctx.arc(A.x, A.y, 24, 0, TAU); ctx.fillStyle = 'rgba(59,76,255,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(A.x, A.y, 13, 0, TAU); ctx.fillStyle = INK; ctx.fill();
  }
}
function hud(left, right, center, centerColor) {
  if (left) txt(left, 32, 40, 48, { align: 'left' });
  if (right) txt(right, W - 32, 40, 48, { align: 'right', color: RED });
  if (center) txt(center, W / 2, 40, 30, { color: centerColor || AMBER });
}
function buttons(list, dt) {
  const hs = hands();
  let active = null;
  for (const b of list) {
    const inside = hs.some(h => h.x > b.x && h.x < b.x + b.w && h.y > b.y && h.y < b.y + b.h);
    if (inside) active = b;
    rr(b.x, b.y, b.w, b.h, 22);
    ctx.fillStyle = inside ? 'rgba(255,176,32,.28)' : 'rgba(6,7,11,.6)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = inside ? AMBER : 'rgba(255,255,255,.35)'; ctx.stroke();
    txt(b.label, b.x + b.w / 2, b.y + b.h / 2 - (b.sub ? b.h * 0.1 : 0), Math.min(40, b.h * 0.28));
    if (b.sub) txt(b.sub, b.x + b.w / 2, b.y + b.h / 2 + b.h * 0.2, Math.min(18, b.h * 0.15), { color: '#C9CCDD' });
  }
  if (active) {
    if (hover.key !== active.label) { hover.key = active.label; hover.t = 0; }
    hover.t += dt;
    const p = Math.min(1, hover.t / 1.1);
    ctx.beginPath(); ctx.lineWidth = 8; ctx.strokeStyle = AMBER;
    ctx.arc(active.x + active.w - 26, active.y + 26, 14, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke();
    if (p >= 1) { hover.key = null; hover.t = 0; beep(700, 0.1, 'triangle', 0.2); active.action(); }
  } else { hover.key = null; hover.t = 0; }
  return list;
}
let liveButtons = [], tapButtons = [];
cv.addEventListener('pointerdown', e => {
  for (const b of liveButtons.concat(tapButtons)) if (e.clientX > b.x && e.clientX < b.x + b.w && e.clientY > b.y && e.clientY < b.y + b.h) { b.action(); break; }
});
function envToggle() {   // tap-only button: switch between drawn arena and your real room
  const w = 150, h = 34, x = W / 2 - w / 2, y = 62;
  rr(x, y, w, h, 17); ctx.fillStyle = 'rgba(6,7,11,.55)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
  txt(env === 'stadium' ? 'View: arena' : 'View: my room', W / 2, y + h / 2, 15, { color: '#C9CCDD' });
  tapButtons = [{ x, y, w, h, action: () => { env = env === 'stadium' ? 'room' : 'stadium'; beep(600, 0.05); } }];
}

// ---------- Crowd + arena pieces ----------
function drawCrowdTiers(y0, rows, rowH, dark, light, crowd, t, seed) {
  const rnd = seeded(seed);
  for (let i = 0; i < rows; i++) {
    const y = y0 + i * rowH;
    ctx.fillStyle = i % 2 ? dark : light; ctx.fillRect(0, y, W, rowH);
    for (let j = 0; j < W / 9; j++) {
      const jump = crowd > 0.05 ? Math.max(0, Math.sin(t * 9 + j * 0.7 + i)) * rowH * 0.5 * crowd : 0;
      ctx.fillStyle = `hsl(${rnd() * 360},60%,${45 + rnd() * 30}%)`; ctx.fillRect(j * 9 + rnd() * 4, y + 2 + rnd() * (rowH * 0.4) - jump, 4, rowH * 0.5);
    }
    if (crowd > 0.3) for (let k = 0; k < 6; k++) if (Math.random() < crowd * 0.5) { ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(Math.random() * W, y + Math.random() * rowH, 2.5, 0, TAU); ctx.fill(); }
  }
}
function drawFigure(px, py, hgt, kit, run = 0, arms = 0) {   // small NPC: feet at (px,py), hgt in px
  const h = hgt, sway = run ? Math.sin(run * 12) * h * 0.14 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(px, py, h * 0.16, h * 0.04, 0, 0, TAU); ctx.fill();
  ctx.lineCap = 'round'; ctx.strokeStyle = kit.pants; ctx.lineWidth = Math.max(1.5, h * 0.06);
  ctx.beginPath(); ctx.moveTo(px - h * 0.05, py - h * 0.5); ctx.lineTo(px - h * 0.07 + sway, py); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px + h * 0.05, py - h * 0.5); ctx.lineTo(px + h * 0.07 - sway, py); ctx.stroke();
  ctx.fillStyle = kit.shirt; rr(px - h * 0.11, py - h * 0.82, h * 0.22, h * 0.34, h * 0.05); ctx.fill();
  ctx.strokeStyle = kit.shirt; ctx.lineWidth = Math.max(1.5, h * 0.05);

      if (segDist(it.x, it.y, gx - s.dir.x * U() * 0.05, gy - s.dir.y * U() * 0.05, tx, ty) < it.r + U() * 0.025) return true;
    }
    return false;
  });
  for (const it of g.items) {
    it.x += it.vx * dtW; it.y += it.vy * dtW; it.vy += 1.1 * H * dtW; it.rot += it.vr * dtW;
    if (it.half) { drawFruit(it.type, it.x, it.y, it.r, it.rot, it.half); if (it.y > H + it.r * 2) it.dead = true; continue; }
    if (it.bomb) drawBomb(it.x, it.y, it.r, g.t); else drawFruit(it.type, it.x, it.y, it.r, it.rot, 0, g.t);
    const bl = cutBy(it);
    if (bl) {
      it.dead = true;
      if (it.bomb) {
        g.lives--; flash = 0.6; g.shake = 1; pop('BOOM', it.x, it.y, RED, 90); burst(it.x, it.y, '#FF6A1A', 36, U() * 1.0); burst(it.x, it.y, '#FFD84A', 20, U() * 0.7);
        noise(0.6, 0.45, 260, 0.6); haptic(600, 1, 1);
        for (const o of g.items) if (o !== it && !o.half) { const d = Math.max(40, Math.hypot(o.x - it.x, o.y - it.y)); o.vx += (o.x - it.x) / d * U() * 1.2; o.vy += (o.y - it.y) / d * U() * 1.2 - U() * 0.4; }
      } else {
        const pts = it.type.pts; g.score += pts; g.sliced++; g.comboN++; g.comboT = 0.5;
        if (it.type.gold) { g.slow = 1.4; pop('GOLDEN! +50', it.x, it.y - it.r, AMBER, 56); noise(0.8, 0.25, 1500, 2); haptic(250, 1, 0.8); }
        else { pop('+' + pts, it.x, it.y - it.r * 1.2, WHITE, 30); beep(650 + Math.random() * 350, 0.05, 'triangle', 0.16); haptic(45, 0.5, 0.7); }
        burst(it.x, it.y, it.type.inner, 16, U() * 0.55);
        const blobs = Array.from({ length: 7 }, () => ({ x: (Math.random() - 0.5) * it.r * 2.2, y: (Math.random() - 0.5) * it.r * 2.2, r: it.r * (0.15 + Math.random() * 0.3) }));
        g.splats.push({ x: it.x, y: it.y, color: it.type.inner, blobs, t: 2.5 });
        const ang = Math.atan2(bl.vy, bl.vx), px = -Math.sin(ang), py = Math.cos(ang), kick = U() * 0.35;
        g.marks.push({ x: it.x, y: it.y, ang, t: 0.25 });
        g.items.push({ half: 1, type: it.type, r: it.r, x: it.x - px * it.r * 0.25, y: it.y - py * it.r * 0.25, vx: it.vx * 0.6 - px * kick, vy: it.vy * 0.5 - py * kick, rot: ang, vr: -3 });
        g.items.push({ half: 2, type: it.type, r: it.r, x: it.x + px * it.r * 0.25, y: it.y + py * it.r * 0.25, vx: it.vx * 0.6 + px * kick, vy: it.vy * 0.5 + py * kick, rot: ang, vr: 3 });
      }
    } else if (it.y > H + it.r * 2 && it.vy > 0) {
      it.dead = true;
      if (!it.bomb && !it.type.gold) { g.lives--; flash = 0.35; pop('missed', it.x, H * 0.85, '#C9CCDD', 30); beep(150, 0.25, 'sawtooth', 0.25); haptic(120, 0.6, 0.3); }
    } else if ((it.x < -it.r * 3 && it.vx < 0) || (it.x > W + it.r * 3 && it.vx > 0)) it.dead = true;
  }
  g.items = g.items.filter(i => !i.dead);
  for (const m of g.marks) { m.t -= dt; ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ang); ctx.globalAlpha = m.t * 4; ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-U() * 0.12, 0); ctx.lineTo(U() * 0.12, 0); ctx.stroke(); ctx.restore(); }
  ctx.globalAlpha = 1; g.marks = g.marks.filter(m => m.t > 0);
  for (const side of ['left', 'right']) drawRibbon(g.ribbons[side]);
  for (const side of ['left', 'right']) { const s = swords[side]; if (!s.active) continue; const glow = clamp(s.speed / U() - 0.3, 0, 1); if (s.drawn > 0.08) drawSword(s, glow); drawFist(s, glow); }
  if (handModelState === 'ready') txt('Fist closed = sword out. Open hand = sheathed', W / 2, H - 22, 15, { color: '#C9CCDD' });
  else if (handModelState === 'loading') txt('Loading hand tracking…', W / 2, H - 22, 15, { color: '#7C819A' });
  ctx.restore();
  if (g.slow > 0) { ctx.fillStyle = 'rgba(255,216,74,.08)'; ctx.fillRect(0, 0, W, H); }
  hud(String(g.score), '♥'.repeat(Math.max(0, g.lives)) + '♡'.repeat(3 - Math.max(0, g.lives)), g.comboN >= 2 ? `${g.comboN} combo` : '');
  if (!poseSeen) txt('Step back so your shoulders and hands are in view', W / 2, H * 0.5, 26, { color: '#C9CCDD' });
  drawPiP('left'); liveButtons = []; tapButtons = [];
  if (g.lives <= 0) { g.final = g.score; state = 'over'; }
}

// ---------- Punch Out ----------
function newPunch() { return { score: 0, t: 60, targets: [], spawn: 0.5, combo: 0, best: 0 }; }
function punch(dt) {
  const g = game; g.t -= dt;
  drawCamera(0.55); drawHands();
  g.spawn -= dt;
  if (g.spawn <= 0 && g.targets.length < 4) {
    const r = 46 + Math.random() * 20;
    g.targets.push({ x: r + 60 + Math.random() * (W - 2 * r - 120), y: r + 90 + Math.random() * (H * 0.55), r, life: 2.6, max: 2.6 });
    g.spawn = 0.75;
  }
  const hs = hands();
  for (const t of g.targets) {
    t.life -= dt;
    const p = t.life / t.max;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fillStyle = 'rgba(59,76,255,.85)'; ctx.fill();
    ctx.beginPath(); ctx.lineWidth = 8; ctx.strokeStyle = WHITE; ctx.arc(t.x, t.y, t.r + 10, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke();
    if (hs.some(h => Math.hypot(h.x - t.x, h.y - t.y) < t.r + 26)) {
      t.hit = true; g.combo++; g.best = Math.max(g.best, g.combo); g.score += 10 * Math.min(5, g.combo);
      beep(500 + g.combo * 60, 0.06); burst(t.x, t.y, INK, 10, U() * 0.4); haptic(40, 0.5, 0.5);
    }
    if (t.life <= 0) { t.hit = true; g.combo = 0; }
  }
  g.targets = g.targets.filter(t => !t.hit);
  txt(String(g.score), 32, 40, 48, { align: 'left' });
  txt(Math.ceil(g.t) + 's', W - 32, 40, 48, { align: 'right', color: g.t < 10 ? RED : WHITE });
  if (g.combo > 1) txt(`×${Math.min(5, g.combo)} combo`, W / 2, 40, 30, { color: AMBER });
  liveButtons = []; tapButtons = [];
  if (g.t <= 0) { g.final = g.score; state = 'over'; }
}

// ---------- Asteroid Smash ----------
function bgSpace(t) {
  const url = BG_IMAGES.asteroids, im = url && (bgImgs.asteroids || (bgImgs.asteroids = Object.assign(new Image(), { src: url })));
  if (im && im.complete && im.naturalWidth) { const s = Math.max(W / im.naturalWidth, H / im.naturalHeight); ctx.drawImage(im, (W - im.naturalWidth * s) / 2, (H - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s); return; }
  const rnd = seeded(3);
  ctx.fillStyle = '#02030A'; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(W * 0.25, H * 0.35, 0, W * 0.25, H * 0.35, H * 0.7); g.addColorStop(0, 'rgba(120,60,200,.28)'); g.addColorStop(1, 'rgba(120,60,200,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W * 0.8, H * 0.2, 0, W * 0.8, H * 0.2, H * 0.6); g.addColorStop(0, 'rgba(40,120,220,.22)'); g.addColorStop(1, 'rgba(40,120,220,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 220; i++) { const x = rnd() * W, y = rnd() * H * 0.85, r = rnd() * 1.8 + 0.4, tw = 0.55 + 0.45 * Math.sin(t * (1 + rnd() * 3) + rnd() * 6); ctx.fillStyle = `rgba(255,255,255,${tw})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  g = ctx.createRadialGradient(W * 0.08, H * 0.12, 0, W * 0.08, H * 0.12, U() * 0.11); g.addColorStop(0, '#E8B36A'); g.addColorStop(0.7, '#9C5A2A'); g.addColorStop(1, '#3A2010'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W * 0.08, H * 0.12, U() * 0.11, 0, TAU); ctx.fill();
  const ex = W / 2, ey = H * 0.85 + H * 1.3, er = H * 1.3;
  g = ctx.createRadialGradient(ex, ey, er, ex, ey, er + H * 0.08); g.addColorStop(0, 'rgba(90,170,255,.45)'); g.addColorStop(1, 'rgba(90,170,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, er + H * 0.08, 0, TAU); ctx.fill();
  g = ctx.createRadialGradient(ex - W * 0.2, ey - er * 0.9, 0, ex, ey, er); g.addColorStop(0, '#5EA9E8'); g.addColorStop(0.5, '#2B6BB8'); g.addColorStop(1, '#0B2450'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(80,150,70,.7)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(W * (0.1 + rnd() * 0.8), H * (0.87 + rnd() * 0.1), W * (0.04 + rnd() * 0.06), H * 0.02, rnd(), 0, TAU); ctx.fill(); }
}
function drawRock(o) {
  const rnd = seeded(o.seed);
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a);
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, r = o.r * (0.78 + rnd() * 0.3); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath();
  const g = ctx.createRadialGradient(-o.r * 0.3, -o.r * 0.3, o.r * 0.1, 0, 0, o.r); g.addColorStop(0, o.kick ? '#9ADB7A' : '#B8BCC8'); g.addColorStop(1, o.kick ? '#2C5A22' : '#3A3D48');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc((rnd() - 0.5) * o.r, (rnd() - 0.5) * o.r, o.r * (0.1 + rnd() * 0.15), 0, TAU); ctx.fill(); }
  ctx.restore();
  if (o.kick) txt('KICK', o.x, o.y, Math.max(14, o.r * 0.4), { color: '#DFFFD0' });
}
function newAsteroids() { return { score: 0, shield: 3, t: 0, rocks: [], spawn: 1, combo: 0, kills: 0 }; }
function asteroids(dt) {
  const g = game; g.t += dt;
  if (env === 'room') drawCamera(0.35); else bgSpace(g.t);
  drawHands(); drawFeet();
  g.spawn -= dt;
  if (g.spawn <= 0) {
    const r = U() * (0.05 + Math.random() * 0.04);
    g.rocks.push({ x: r + Math.random() * (W - 2 * r), y: -r, r, vy: H * (0.13 + g.t * 0.004 + Math.random() * 0.04), vx: (Math.random() - 0.5) * W * 0.05, a: Math.random() * TAU, va: (Math.random() - 0.5) * 2, seed: 1 + Math.floor(Math.random() * 100000), kick: Math.random() < 0.35 });
    g.spawn = Math.max(0.45, 1.3 - g.t * 0.015);
  }
  for (const o of g.rocks) {
    o.y += o.vy * dt; o.x += o.vx * dt; o.a += o.va * dt; drawRock(o);
    const hit = limbs.find(l => l.speed > 0.9 * U() && Math.hypot(l.x - o.x, l.y - o.y) < o.r + U() * 0.05 && (!o.kick || l.kind === 'foot'));
    if (hit) {
      o.dead = true; g.combo++; g.kills++; const pts = (hit.kind === 'foot' ? 40 : 20) * Math.min(4, g.combo); g.score += pts;
      pop((hit.kind === 'foot' ? 'KICK ' : '') + '+' + pts, o.x, o.y, hit.kind === 'foot' ? AMBER : WHITE, 40);
      burst(o.x, o.y, o.kick ? '#9ADB7A' : '#B8BCC8', 16, U() * 0.6); beep(hit.kind === 'foot' ? 300 : 440, 0.08, 'square', 0.2); haptic(hit.kind === 'foot' ? 90 : 50, 0.7, 0.6);
    } else if (o.y > H * 0.86 - o.r * 0.3) { o.dead = true; g.shield--; g.combo = 0; flash = 0.45; burst(o.x, H * 0.86, RED, 20, U() * 0.7); beep(110, 0.35, 'sawtooth', 0.3); noise(0.5, 0.3, 300, 0.7); haptic(300, 1, 1); }
  }
  g.rocks = g.rocks.filter(o => !o.dead);
  hud(String(g.score), '◆'.repeat(g.shield) + '◇'.repeat(3 - g.shield), g.combo > 1 ? `×${Math.min(4, g.combo)} combo` : '');
  envToggle(); liveButtons = [];
  if (g.shield <= 0) { g.final = g.score; state = 'over'; }
}

// ---------- Screens ----------
function startCal(next) { pending = next; cal.t = 0; state = 'calibrate'; }
function menu(dt) {
  drawCamera(0.55); drawHands();
  txt('MoveBox', W / 2, H * 0.14, Math.min(90, W * 0.1));
  txt(poseSeen ? 'Hold a hand over a game to pick it' : 'Step back until your whole body is visible', W / 2, H * 0.26, 24, { color: '#C9CCDD' });
  const cols = 3, gx = 16, gy = 14, bw = Math.min(300, (W - 80 - gx * (cols - 1)) / cols), bh = Math.min(150, H * 0.24), y0 = H * 0.34;
  const rows = [GAMES.slice(0, 3), GAMES.slice(3)];
  const list = [];
  rows.forEach((row, ri) => { const x0 = (W - (row.length * bw + (row.length - 1) * gx)) / 2; row.forEach((gm, i) => list.push({ label: gm.label, sub: gm.sub, x: x0 + i * (bw + gx), y: y0 + ri * (bh + gy), w: bw, h: bh, action: () => startCal(gm.key) })); });
  liveButtons = buttons(list, dt); tapButtons = [];
  txt(gamepadOn ? 'Controller: connected' : 'Controller: not connected', W - 20, H - 20, 15, { align: 'right', color: gamepadOn ? AMBER : '#7C819A' });
}
function calibrate(dt) {
  drawCamera(0.45); drawHands();
  const b = body(); const hips = kp('left_hip') && kp('right_hip');
  if (b && hips) {
    cal.t += dt;
    txt('Stand still', W / 2, H * 0.2, 56);
    txt(String(Math.max(1, Math.ceil(cal.need - cal.t))), W / 2, H * 0.5, 180, { color: AMBER });
    if (cal.t >= cal.need) newGame(pending);
  } else {
    cal.t = 0;
    txt('Step back', W / 2, H * 0.42, 64);
    txt('Shoulders and hips need to be in frame', W / 2, H * 0.55, 26, { color: '#C9CCDD' });
  }
  liveButtons = []; tapButtons = [];
}
function newGame(kind) {
  state = kind; flash = 0; pops.length = 0; parts.length = 0; camReset(); cam.zoom = 1; cam.x = cam.y = 0;
  game = { cricket: newCricket, hoops: newHoops, fruit: newFruit, punch: newPunch, asteroids: newAsteroids }[kind]();
  game.hint = 4;
}
function over(dt) {
  drawCamera(0.7); drawHands();
  const gm = gameByKey(pending);
  txt(gm.label, W / 2, H * 0.14, 34, { color: '#C9CCDD' });
  txt(String(game.final), W / 2, H * 0.32, 130, { color: AMBER });
  let sub = '';
  if (pending === 'punch' && game.best) sub = `best combo ×${Math.min(5, game.best)}`;
  if (pending === 'cricket') sub = `${game.sixes} sixes, ${game.fours} fours, ${game.wickets} out`;
  if (pending === 'hoops') sub = `${game.made} of ${game.tries} shots`;
  if (pending === 'fruit') sub = `${game.sliced} fruit sliced`;
  if (pending === 'asteroids') sub = `${game.kills} rocks smashed`;
  if (sub) txt(sub, W / 2, H * 0.47, 26, { color: '#C9CCDD' });
  const bw = Math.min(340, W * 0.38), bh = Math.min(130, H * 0.22), gap = 40, y = H * 0.6;
  liveButtons = buttons([
    { label: 'Play again', x: W / 2 - bw - gap / 2, y, w: bw, h: bh, action: () => newGame(pending) },
    { label: 'Menu', x: W / 2 + gap / 2, y, w: bw, h: bh, action: () => { state = 'menu'; } },
  ], dt); tapButtons = [];
}

// ---------- Main loop ----------
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateLimbs(dt);
  ({ menu, calibrate, cricket, hoops, fruit, punch, asteroids, over })[state](dt);
  if (['cricket', 'hoops', 'asteroids'].includes(state) && env === 'stadium') drawPiP();
  drawFx(dt);
  const gm = gameByKey(state);
  if (gm && game && game.hint > 0) { game.hint -= dt; ctx.globalAlpha = Math.min(1, game.hint); txt(gm.hint, W / 2, H * 0.12, 24, { color: '#C9CCDD' }); ctx.globalAlpha = 1; }
  if (toastT > 0) { toastT -= dt; ctx.globalAlpha = Math.min(1, toastT); txt(toastMsg, W / 2, H - 30, 20, { color: AMBER }); ctx.globalAlpha = 1; }
  if (flash > 0) { flash -= dt; ctx.fillStyle = `rgba(255,61,90,${flash})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

// ---------- Boot ----------
document.getElementById('go').addEventListener('click', async () => {
  try {
    statusEl.textContent = 'Opening camera…';
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Loading body tracker…';
    await tf.setBackend('webgl'); await tf.ready();
    const accurate = document.getElementById('model').value === 'thunder';
    detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      { modelType: accurate ? poseDetection.movenet.modelType.SINGLEPOSE_THUNDER : poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: false });
    startEl.remove(); resize();
    loadHandModel();
    if (navigator.getGamepads && [...navigator.getGamepads()].some(Boolean)) gamepadOn = true;
    poseLoop(); last = performance.now(); requestAnimationFrame(frame);
  } catch (err) {
    statusEl.textContent = err.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow the camera for this page in Chrome and try again.'
      : 'Could not start: ' + err.message + ' (check you have internet for the first load)';
  }
});
